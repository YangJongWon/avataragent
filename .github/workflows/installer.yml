# Builds the Windows installer (AIAgentOffice-Setup-<version>.exe).
# A version tag (v0.2.0) attaches it to that GitHub release; a manual run keeps it as a workflow artifact.
name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { (Get-Content package.json -Raw | ConvertFrom-Json).version }
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/build.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: AIAgentOffice-Setup
          path: build/installer/AIAgentOffice-Setup-*.exe

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/installer/AIAgentOffice-Setup-*.exe
